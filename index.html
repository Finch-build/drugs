<!doctype html>
<html lang="en" data-theme="standard">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Mission Control for ProPublica's Rx Inspector data: find where your generic prescription drug was made and see FDA inspection history for every factory on a live globe." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <title>Rx Mission Control</title>
    <script>
      try {
        var saved = localStorage.getItem("rx-theme");
        if (saved === "ascii" || saved === "standard") document.documentElement.dataset.theme = saved;
      } catch (e) {}
    </script>
  </head>

    <script type="module" src="/src/main.tsx"></script>
